name: Android CI

# Assumes the `android/` directory is the repository root (it contains this
# `.github/`). If you nest it under a monorepo, move this file to the repo-root
# `.github/workflows/` and add `paths:` / `working-directory:` for `android/`.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate wrapper (first run only)
        run: gradle wrapper --gradle-version 8.11.1

      - name: assembleDebug + unit tests + lint
        run: ./gradlew assembleDebug testDebugUnitTest lint --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
